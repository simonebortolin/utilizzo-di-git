name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Stages: Compile PDF (aergus/latex container)
#         -> Pre-release (pull requests) / Tag & Release + GitHub Pages (master)
jobs:
  compile:
    name: Compile PDF
    runs-on: ubuntu-latest
    container:
      image: aergus/latex
    outputs:
      # "YYYY.MM.DD.<run>" on master, "YYYY.MM.DD-pr.<PR>.<run>" on a pull request.
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          DATE=$(date -u +%Y.%m.%d)
          if [ -n "$PR_NUMBER" ]; then
            VERSION="${DATE}-pr.${PR_NUMBER}.${RUN_NUMBER}"
          else
            VERSION="${DATE}.${RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Version \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Compile main.tex
        run: latexmk -xelatex -interaction=nonstopmode -halt-on-error main.tex

      # On failure show the end of the LaTeX log, so the error is readable without artifacts.
      - name: Show LaTeX log
        if: failure()
        shell: bash
        run: tail -n 80 main.log || true

      - name: Rename PDF
        shell: bash
        run: mv main.pdf "utilizzo-di-git-${{ steps.version.outputs.version }}.pdf"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: pdf
          path: utilizzo-di-git-*.pdf
          if-no-files-found: error

  prerelease:
    name: PR Pre-release
    runs-on: ubuntu-latest
    needs: [compile]
    # Same-repository PRs only: a fork's pull_request run gets a read-only token, and this
    # deliberately doesn't use pull_request_target. Fork PRs still upload the workflow artifact.
    # Dependabot PRs are same-repo but GitHub also gives them a read-only token.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    concurrency:
      group: prerelease-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.compile.outputs.version }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BUILD_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Download PDF
        uses: actions/download-artifact@v8
        with:
          name: pdf
          path: release

      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          ls -lh

      # GitHub only stores attestations for public (or organization) repositories.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'release/*.pdf'

      # One pre-release per PR, replaced on every push. Each run gets its own tag
      # (pr-<N>-<run>-<attempt>): with immutable releases a tag can never be reused.
      - name: Publish pre-release
        run: |
          TAG="pr-${PR_NUMBER}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

          cat > notes.md <<NOTES
          Automatic pre-release for #${PR_NUMBER}: ${PR_TITLE}

          - Version: \`${VERSION}\`
          - PR head: ${HEAD_SHA}
          - Built from merge preview: ${BUILD_SHA}
          - Workflow run: ${RUN_URL}

          > [!WARNING]
          > Build of an unmerged pull request. It's replaced on every push and deleted when the PR is closed.
          NOTES

          gh release create "$TAG" release/* \
            --prerelease \
            --latest=false \
            --target "$HEAD_SHA" \
            --title "PR #${PR_NUMBER} pre-release (${VERSION})" \
            --notes-file notes.md

          # Only now drop this PR's older pre-releases, so there's always one to link to.
          # "pr-<N>-" can't match another PR's tags (pr-3- vs pr-30-).
          gh release list --limit 1000 --json tagName \
            --jq ".[].tagName | select(startswith(\"pr-${PR_NUMBER}-\")) | select(. != \"${TAG}\")" |
          while read -r OLD; do
            gh release delete "$OLD" --cleanup-tag --yes || echo "::warning::Could not delete $OLD"
          done

      - name: Comment on the pull request
        run: |
          MARKER='<!-- utilizzo-di-git-prerelease -->'
          URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}"
          BODY="${MARKER}
          **Pre-release \`${VERSION}\` is ready:** ${URL}

          PDF of ${HEAD_SHA}. Updated on every push, deleted when this PR is closed."

          COMMENT_ID=$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${COMMENT_ID}" -f body="$BODY" >/dev/null
          else
            gh api -X POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -f body="$BODY" >/dev/null
          fi

  release:
    name: Tag & Release
    runs-on: ubuntu-latest
    needs: [compile]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.compile.outputs.version }}

    steps:
      - name: Download PDF
        uses: actions/download-artifact@v8
        with:
          name: pdf
          path: release

      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # GitHub only stores attestations for public (or organization) repositories.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'release/*.pdf'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release/*

  # The latest PDF at a fixed URL: <owner>.github.io/<repo>/utilizzo-di-git.pdf.
  # Needs Settings -> Pages -> Source: "GitHub Actions".
  pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: [compile]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}utilizzo-di-git.pdf
    env:
      VERSION: ${{ needs.compile.outputs.version }}

    steps:
      - name: Download PDF
        uses: actions/download-artifact@v8
        with:
          name: pdf
          path: pdf

      - name: Build site
        run: |
          mkdir -p site
          cp pdf/*.pdf site/utilizzo-di-git.pdf
          cat > site/index.html <<HTML
          <!doctype html>
          <html lang="it">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=utilizzo-di-git.pdf">
            <title>Utilizzo di Git</title>
          </head>
          <body>
            <p><a href="utilizzo-di-git.pdf">Utilizzo di Git (${VERSION})</a></p>
          </body>
          </html>
          HTML

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
